name: test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        # Integration tests that hit the real Scrive API self-skip when
        # CLIENT_CREDENTIALS_IDENTIFIER / TOKEN_CREDENTIALS_IDENTIFIER are
        # unset (see common_test.go::hasScriveCredentials), so this runs
        # the unit tests on every PR without needing credentials.
        run: go test -race -count=1 ./...

  # Once the tests pass on master, tag and release the next patch version
  # (go-library-release.yml, a copy of buildpipeline's), so services require real
  # versions and Renovate offers version bumps instead of commit-hash updates.
  release:
    needs: [test]
    if: github.event_name == 'push'
    permissions:
      contents: write
    uses: ./.github/workflows/go-library-release.yml
